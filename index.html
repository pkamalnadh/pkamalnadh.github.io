<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PK. Amalnadh | Business Intelligence</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:#020817;
    color:white;
    overflow-x:hidden;
}

/* ---------- BACKGROUND ---------- */

body{
    background:
        radial-gradient(circle at 10% 20%,rgba(0,160,255,.13),transparent 30%),
        radial-gradient(circle at 90% 70%,rgba(120,50,255,.13),transparent 30%),
        #020817;
}

.grid{
    position:fixed;
    inset:0;
    z-index:-2;
    background-image:
        linear-gradient(rgba(40,150,255,.045) 1px,transparent 1px),
        linear-gradient(90deg,rgba(40,150,255,.045) 1px,transparent 1px);
    background-size:55px 55px;
    animation:gridMove 18s linear infinite;
}

@keyframes gridMove{
    from{transform:translateY(0)}
    to{transform:translateY(55px)}
}

/* ---------- NAV ---------- */

nav{
    position:sticky;
    top:0;
    z-index:100;
    height:76px;
    padding:0 7%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:rgba(2,8,23,.82);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(100,180,255,.12);
}

.logo{
    font-size:25px;
    font-weight:800;
}

.logo span{
    color:#38c9ff;
}

nav ul{
    display:flex;
    gap:30px;
    list-style:none;
}

nav a{
    color:#9eacc0;
    text-decoration:none;
    transition:.3s;
}

nav a:hover{
    color:#42d9ff;
}
