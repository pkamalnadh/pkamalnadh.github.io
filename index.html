<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PK. Amalnadh | Business Intelligence</title>


<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:#020817;

    color:#ffffff;

    overflow-x:hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

body{

    background:

        radial-gradient(
            circle at 10% 20%,
            rgba(0,160,255,.13),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 70%,
            rgba(120,50,255,.13),
            transparent 30%
        ),

        #020817;
}


.grid{

    position:fixed;

    inset:0;

    z-index:-2;

    background-image:

        linear-gradient(
            rgba(40,150,255,.045) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(40,150,255,.045) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    animation:gridMove 18s linear infinite;
}


@keyframes gridMove{

    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(55px);
    }
}


/* =====================================================
   NAVIGATION
===================================================== */

nav{

    position:sticky;

    top:0;

    z-index:100;

    height:76px;

    padding:0 7%;

    display:flex;

    align-items:center;

    justify-content:space-between;

    background:
        rgba(2,8,23,.82);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid
        rgba(100,180,255,.12);
}


.logo{

    font-size:25px;

    font-weight:800;
}


.logo span{

    color:#38c9ff;
}


nav ul{

    display:flex;

    gap:30px;

    list-style:none;
}


nav a{

    color:#9eacc0;

    text-decoration:none;

    transition:.3s;
}


nav a:hover{

    color:#42d9ff;
}


/* =====================================================
   HERO
===================================================== */

.hero{

    min-height:
        calc(100vh - 76px);

    padding:
        70px 7%;

    display:flex;

    align-items:center;
}


.hero-wrap{

    width:100%;

    max-width:1250px;

    margin:auto;

    display:grid;

    grid-template-columns:
        .9fr 1.1fr;

    gap:55px;

    align-items:center;
}


/* =====================================================
   HERO TEXT
===================================================== */

.small-title{

    color:#48d7ff;

    font-size:13px;

    font-weight:700;

    letter-spacing:3px;

    margin-bottom:20px;
}


h1{

    font-size:
        clamp(
            55px,
            7vw,
            90px
        );

    line-height:.95;

    letter-spacing:-4px;

    margin-bottom:25px;
}


.name{

    background:

        linear-gradient(
            90deg,
            #209cff,
            #39ddff,
            #7868ff,
            #ff55d6
        );

    background-size:300%;

    -webkit-background-clip:text;

    background-clip:text;

    color:transparent;

    animation:
        gradient 7s ease infinite;
}


@keyframes gradient{

    0%{
        background-position:0%;
    }

    50%{
        background-position:100%;
    }

    100%{
        background-position:0%;
    }
}


/* =====================================================
   TYPING
===================================================== */

.typing{

    font-size:
        clamp(
            23px,
            3vw,
            35px
        );

    font-weight:700;

    color:#3edcff;

    min-height:45px;
}


.cursor{

    color:#42ff68;

    animation:
        blink .7s infinite;
}


@keyframes blink{

    50%{
        opacity:0;
    }
}


/* =====================================================
   DESCRIPTION
===================================================== */

.description{

    max-width:650px;

    margin-top:20px;

    color:#e4eaf2;

    line-height:1.8;

    font-size:17px;
}


/* =====================================================
   TOOLS / SKILLS
===================================================== */

.hero
