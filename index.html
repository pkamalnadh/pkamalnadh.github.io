<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:#020817;
    color:#f4f8ff;

    overflow-x:hidden;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before{
    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:-3;

    background:
        radial-gradient(
            circle at 10% 20%,
            rgba(0,140,255,.15),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 70%,
            rgba(125,45,255,.13),
            transparent 30%
        );
}


/* futuristic grid */

body::after{
    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:-2;

    opacity:.25;

    background-image:
        linear-gradient(
            rgba(40,180,255,.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(40,180,255,.08) 1px,
            transparent 1px
        );

    background-size:70px 70px;

    mask-image:
        linear-gradient(
            to bottom,
            black,
            transparent 85%
        );
}


/* =========================================================
   NAVIGATION
========================================================= */

    border-bottom:
        1px solid rgba(100,180,255,.08);

    z-index:100;
}

}
