<style>

/* ================================
   RESET
================================ */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #07101d;
    color: white;
    overflow-x: hidden;
}


/* ================================
   BACKGROUND
================================ */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(0, 255, 120, 0.08),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 60%,
            rgba(0, 150, 255, 0.08),
            transparent 30%
        ),
        #07101d;
}


/* GRID */

body::after {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;

    background-image:
        linear-gradient(
            rgba(80, 180, 255, 0.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(80, 180, 255, 0.055) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    pointer-events: none;
}


/* ================================
   NAVIGATION
================================ */

}
