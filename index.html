/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #07101f;
    color: #ffffff;
    overflow-x: hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -2;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(0, 255, 120, 0.08),
            transparent 30%
        ),
        radial-gradient(
            circle at 85% 70%,
            rgba(0, 180, 255, 0.08),
            transparent 30%
        ),
        #07101f;
}

.grid {
    position: fixed;
    inset: 0;
    z-index: -1;

    background-image:
        linear-gradient(
            rgba(70, 160, 200, 0.08) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(70, 160, 200, 0.08) 1px,
            transparent 1px
        );

    background-size: 55px 55px;

    pointer-events: none;
}


/* =====================================================
   NAVBAR
===================================================== */

nav {
    position: sticky;
    top: 0;
    z-index: 100;

    height: 76px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 7%;

    background: rgba(7, 15, 29, 0.92);

    backdrop-filter: blur(15px);

    border-bottom: 1px solid rgba(100, 200, 255, 0.15);
}

.logo {
    font-size: 25px;
    font-weight: 800;
}

.logo span {
    color: #42dcff;
}

nav ul {
    display: flex;
    gap: 28px;
    list-style: none;
}

nav a {
    color: #b5c2d3;
    text-decoration: none;
    transition: 0.3s;
}

nav a:hover {
    color: #42dcff;
}

   HERO
===================================================== */

.hero {
    min-height: calc(100vh - 76px);

    padding: 80px 7%;

    display: flex;
    align-items: center;
}

.hero-wrap {
    width: 100%;
    max-width: 1250px;

    margin: auto;

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 55px;

    align-items: center;
}

   HERO TEXT
===================================================== */

}

        0 0 30px rgba(50, 255, 100, 0.2);
}
