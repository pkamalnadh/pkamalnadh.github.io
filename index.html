<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PK. Amalnadh | Business Intelligence</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;

    background:#08101f;
    color:#f5f7fb;
    overflow-x:hidden;
}


/* =========================================================
   BACKGROUND
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    z-index:-3;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(0,210,255,.08),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 65%,
            rgba(0,255,130,.06),
            transparent 30%
        ),
        #08101f;
}

.grid-bg{
    position:fixed;
    inset:0;
    z-index:-2;

    background-image:
        linear-gradient(
            rgba(45,180,170,.10) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(45,180,170,.10) 1px,
            transparent 1px
        );

    background-size:85px 85px;

    mask-image:
        linear-gradient(
            to bottom,
            black 0%,
            rgba(0,0,0,.8) 70%,
            transparent 100%
        );

    animation:gridMove 20s linear infinite;
}

@keyframes gridMove{

    from{
        background-position:0 0;
    }

    to{
        background-position:0 85px;
    }
}


/* =========================================================
   NAVIGATION
========================================================= */

nav{

    position:sticky;
    top:0;
    z-index:1000;

    height:78px;

    padding:0 5%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:
        rgba(7,15,28,.92);

    backdrop-filter:blur(16px);

    border-bottom:
        1px solid
        rgba(120,180,220,.14);
}

.logo{

    font-size:25px;
    font-weight:800;
    letter-spacing:-.5px;
}

.logo span{
    color:#ffffff;
}

.menu{

    width:43px;
    height:43px;

    border:0;
    background:transparent;

    display:none;

    flex-direction:column;
    align-items:center;
    justify-content:center;

    gap:6px;

    cursor:pointer;
}

.menu span{

    display:block;

    width:26px;
    height:3px;

    border-radius:10px;

    background:#ffffff;
}

nav ul{

    display:flex;

    list-style:none;

    gap:32px;
}

nav a{

    color:#aebaca;

    text-decoration:none;

    font-size:15px;

    transition:.3s;
}

nav a:hover{
    color:#3de4ff;
}


/* =========================================================
   MOBILE MENU
========================================================= */

.mobile-menu{

    display:none;

    position:fixed;

    top:78px;
    left:0;
    right:0;

    z-index:999;

    background:
        rgba(7,15,28,.97);

    border-bottom:
        1px solid
        rgba(100,190,255,.15);

    padding:15px 25px 25px;

    backdrop-filter:blur(20px);
}

.mobile-menu a{

    display:block;

    padding:16px 5px;

    color:#d8e0ea;

    text-decoration:none;

    border-bottom:
        1px solid
        rgba(255,255,255,.06);
}

.mobile-menu.active{
    display:block;
}


/* =========================================================
   HERO
========================================================= */

.hero{

    min-height:
        calc(100vh - 78px);

    padding:
        45px 5% 80px;

    position:relative;
}

.hero-container{

    max-width:1180px;

    margin:auto;
}


/* =========================================================
   CODE CARD
========================================================= */

.code-card{

    width:100%;

    max-width:670px;

    margin:0 auto 48px;

    padding:27px 30px;

    border-radius:17px;

    background:
        linear-gradient(
            145deg,
            #202020,
            #1a1a1a
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.22);

    font-family:
        "Courier New",
        monospace;

    overflow:hidden;
}

.code-comment{

    color:#43e58a;

    font-size:19px;

    margin-bottom:8px;
}

.code-function{

    font-size:19px;

    color:#ffc928;

    margin-bottom:10px;
}

.code-function span{
    color:#57a5ff;
}

.code-text{

    color:#d7d7d7;

    font-size:18px;

    line-height:1.6;

    margin-left:25px;
}

.code-return{

    color:#b77cff;

    font-size:18px;

    margin-top:8px;

    margin-left:25px;
}

.code-return span{
    color:#42df83;
}


/* =========================================================
   HERO INTRO
========================================================= */

.hero-intro{

    text-align:left;

    max-width:950px;

    margin:auto;
}

.hero-title{

    font-size:
        clamp(
            48px,
            8vw,
            76px
        );

    line-height:1.05;

    letter-spacing:-3px;

    font-weight:800;

    margin-bottom:25px;
}

.hero-title .green{
    color:#43df78;

    text-shadow:
        0 0 20px
        rgba(40,230,100,.35);
}


/* =========================================================
   TYPING
========================================================= */

.hero-role{

    display:flex;
    align-items:center;

    font-size:
        clamp(
            24px,
            4vw,
            34px
        );

    color:#45dfff;

    min-height:45px;

    margin-bottom:30px;
}

.cursor{

    display:inline-block;

    width:4px;
    height:43px;

    margin-left:10px;

    background:#27f05e;

    box-shadow:
        0 0 12px
        rgba(39,240,94,.7);

    animation:blink .8s infinite;
}

@keyframes blink{

    50%{
        opacity:0;
    }
}


/* =========================================================
   HERO DESCRIPTION
========================================================= */

.hero-description{

    max-width:930px;

    font-size:19px;

    line-height:1.65;

    color:#f0f2f6;

    margin-bottom:30px;
}


/* =========================================================
   SKILL PILLS
========================================================= */

.hero-skills{

    display:flex;

    flex-wrap:wrap;

    gap:15px;

    margin-bottom:42px;
}

.skill-pill{

    padding:
        11px 25px;

    border-radius:30px;

    font-size:17px;

    font-weight:500;

    border:1px solid;

    background:
        rgba(255,255,255,.025);

    transition:.35s;
}

.skill-pill:hover{
    transform:translateY(-4px);
}

.python{

    color:#63ed9b;

    border-color:
        rgba(50,230,120,.35);

    box-shadow:
        0 0 22px
        rgba(40,220,100,.08);
}

.ml{

    color:#79b7ff;

    border-color:
        rgba(50,130,255,.4);

    box-shadow:
        0 0 22px
        rgba(30,120,255,.08);
}

.tableau{

    color:#d58bff;

    border-color:
        rgba(170,70,255,.4);
}

.aws{

    color:#ffb067;

    border-color:
        rgba(255,120,30,.4);
}


/* =========================================================
   HERO BUTTONS
========================================================= */

.hero-buttons{

    display:flex;

    gap:26px;

    margin-bottom:55px;
}

.hero-btn{

    min-width:275px;

    padding:18px 30px;

    border-radius:13px;

    text-align:center;

    text-decoration:none;

    font-size:20px;

    font-weight:700;

    transition:.35s;
}

.btn-green{

    color:#07100a;

    background:
        linear-gradient(
            135deg,
            #20d45d,
            #25c96a
        );

    box-shadow:
        0 0 35px
        rgba(30,220,90,.18);
}

.btn-outline{

    color:#42dcff;

    border:
        2px solid
        #23d4f5;

    background:
        rgba(0,130,255,.02);

    box-shadow:
        inset 0 0 20px
        rgba(0,180,255,.025);
}

.hero-btn:hover{

    transform:
        translateY(-4px);

    box-shadow:
        0 12px 35px
        rgba(0,200,255,.15);
}


/* =========================================================
   ABSTRACT DATA GRAPHIC
========================================================= */

.data-visual{

    position:relative;

    width:90%;

    max-width:570px;

    height:370px;

    margin:
        20px auto
        0;

    display:flex;

    align-items:center;

    justify-content:center;
}

.data-orbit{

    position:absolute;

    width:100%;
    height:75%;

    border-radius:
        48%
        53%
        45%
        52%;

    border:
        2px solid
        #00e74e;

    transform:
        rotate(-4deg);

    box-shadow:

        0 0 8px #00e74e,

        0 0 28px
        rgba(0,255,70,.65),

        0 0 65px
        rgba(0,255,70,.3);

    animation:
        orbitFloat 5s ease-in-out infinite;
}

.data-orbit::before{

    content:"";

    position:absolute;

    inset:18px 35px 15px 27px;

    border-radius:
        50%
        45%
        52%
        48%;

    background:
        linear-gradient(
            135deg,
            rgba(3,62,50,.85),
            rgba(0,108,47,.92)
        );

    border:
        1px solid
        rgba(0,255,100,.15);

    box-shadow:
        inset 0 0 55px
        rgba(0,255,80,.18);
}

@keyframes orbitFloat{

    0%,100%{
        transform:
            rotate(-4deg)
            translateY(0);
    }

    50%{
        transform:
            rotate(-2deg)
            translateY(-8px);
    }
}


/* =========================================================
   DATA ICON
========================================================= */

.data-icon{

    position:relative;

    z-index:2;

    width:105px;
    height:105px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#77c18e
